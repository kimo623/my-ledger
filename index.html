<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>點擊測試</title>
</head>
<body style="padding: 30px; text-align: center; font-family: sans-serif;">

  <h2>按鈕觸控檢測</h2>

  <button id="testBtn" style="padding: 20px 40px; font-size: 20px; background: #ff7043; color: white; border: none; border-radius: 12px; margin-top: 30px;">
    點我測試反應
  </button>

  <div id="resultText" style="margin-top: 30px; font-size: 18px; color: green; font-weight: bold;"></div>

  <script>
    var btn = document.getElementById('testBtn');
    var res = document.getElementById('resultText');

    btn.onclick = function() {
      res.innerText = "🎉 點擊成功！按鈕完全正常！";
      alert("觸控與 JavaScript 運作正常！");
    };
  </script>
</body>
</html>
