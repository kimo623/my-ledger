<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的帳本</title>
  <style>
    :root {
      --primary: #ff7043;
      --bg: #f7f8fa;
      --card-bg: #ffffff;
      --text-main: #222222;
      --text-muted: #8c8c8c;
      --income: #e53935;
      --border: #f0f0f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: rgba(0,0,0,0.1); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text-main); padding-bottom: 100px; position: relative; }

    .top-header { background: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .top-header h2 { font-size: 18px; font-weight: 600; }
    .user-pill { font-size: 12px; background: #e8f5e9; color: #2e7d32; padding: 5px 10px; border-radius: 20px; font-weight: bold; }

    .stat-banner { margin: 16px; padding: 20px; border-radius: 16px; background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%); color: #1e3a8a; }
    .stat-banner .label { font-size: 13px; opacity: 0.8; }
    .stat-banner .main-num { font-size: 32px; font-weight: 700; margin: 6px 0; }
    .stat-banner .sub-row { display: flex; gap: 20px; margin-top: 10px; font-size: 13px; }

    .view-container { display: none; padding: 0 16px; }
    .view-container.active { display: block; }

    .section-card { background: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .section-title { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .item-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .item-row:last-child { border-bottom: none; }
    .item-left { display: flex; align-items: center; gap: 12px; }
    .item-icon { width: 38px; height: 38px; border-radius: 10px; background: #fff3e0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .item-title { font-size: 15px; font-weight: 500; }
    .item-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .item-badge { background: #ffebee; color: #c62828; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }

    /* 底部導航欄：拉高層級，允許觸控 */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: #fff; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 50; pointer-events: auto; }
    .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #888; flex: 1; height: 100%; justify-content: center; cursor: pointer; }
    .nav-btn.active { color: var(--primary); font-weight: 600; }
    .nav-btn .icon { font-size: 20px; margin-bottom: 2px; }
    
    .fab-container { flex: 1; display: flex; justify-content: center; align-items: center; height: 100%; }
    .fab-btn { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #ff8a65, #f4511e); color: #fff; border: none; font-size: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(244,81,30,0.35); transform: translateY(-14px); cursor: pointer; }
    .fab-btn:active { transform: translateY(-12px) scale(0.95); }

    /* 遮罩徹底防穿透：關閉時完全禁止接收滑鼠與觸控事件 */
    .modal-overlay { 
      position: fixed; 
      top: 0; left: 0; right: 0; bottom: 0; 
      background: rgba(0,0,0,0.45); 
      z-index: 999; 
      display: flex; 
      align-items: flex-end; 
      opacity: 0; 
      visibility: hidden; 
      pointer-events: none; 
      transition: all 0.2s ease; 
    }
    .modal-overlay.open { 
      opacity: 1; 
      visibility: visible; 
      pointer-events: auto; 
    }
    .modal-sheet { background: #fff; width: 100%; border-radius: 20px 20px 0 0; padding: 20px 18px; max-height: 85vh; overflow-y: auto; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; background: #fafafa; }
    .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 10px; background: var(--primary); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  </style>

  <script>
    var DEFAULT_ACCOUNTS = [
      { id: 'cash', group: 'cash', name: '所有現金支出', balance: 0, subAccounts: ['現金日常', '未分類消費'] },
      { id: 'post', group: 'bank', name: '郵局', balance: 0, subAccounts: ['郵局。晨晨', '郵局。屬於外送', '郵局。賺的收入', '郵局。阿暐', '郵局。健保費1652元', '郵局。暐~年金2658元', '郵局。君~年金2658元', '郵局。存款', '郵局。總'] },
      { id: 'cathay', group: 'bank', name: '國泰', balance: 0, subAccounts: ['一般存款'] },
      { id: 'taishin', group: 'bank', name: '台新', balance: 0, subAccounts: ['一般存款'] },
      { id: 'jko_taishin', group: 'bank', name: '街利存 - 台新', balance: 0, subAccounts: ['日常消費存'] },
      { id: 'ubot', group: 'bank', name: '聯邦銀行', balance: 0, subAccounts: ['一般存款'] }
    ];

    var userAccounts = DEFAULT_ACCOUNTS;
    try {
      var stored = localStorage.getItem('my_acc_v3');
      if (stored) userAccounts = JSON.parse(stored);
    } catch(e){}

    var userRecords = [];
    try {
      var storedRec = localStorage.getItem('my_rec_v3');
      if (storedRec) userRecords = JSON.parse(storedRec);
    } catch(e){}

    var currentViewingGroup = null;

    function saveState() {
      try {
        localStorage.setItem('my_acc_v3', JSON.stringify(userAccounts));
        localStorage.setItem('my_rec_v3', JSON.stringify(userRecords));
      } catch(e){}
    }

    function switchNav(tab) {
      var homeV = document.getElementById('viewHome');
      var accV = document.getElementById('viewAccounts');
      var homeB = document.getElementById('tabHomeBtn');
      var accB = document.getElementById('tabAccBtn');
      var title = document.getElementById('headerTitle');

      if (tab === 'home') {
        homeV.classList.add('active');
        accV.classList.remove('active');
        homeB.classList.add('active');
        accB.classList.remove('active');
        title.innerText = "正在用的帳本";
      } else {
        accV.classList.add('active');
        homeV.classList.remove('active');
        accB.classList.add('active');
        homeB.classList.remove('active');
        title.innerText = "帳戶資產與分項";
        renderAccountView();
      }
    }

      populateAccountSelect();
      var el = document.getElementById('recordModal');
