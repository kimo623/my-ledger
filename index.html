<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的帳本</title>
  <style>
    :root {
      --primary: #ff7043;
      --bg: #f7f8fa;
      --card-bg: #ffffff;
      --text-main: #222222;
      --text-muted: #8c8c8c;
      --income: #e53935;
      --border: #f0f0f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: rgba(0,0,0,0.08); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text-main); padding-bottom: 90px; }

    .top-header { background: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
    .top-header h2 { font-size: 18px; font-weight: 600; }
    .auth-btn-top { font-size: 13px; background: var(--primary); color: white; padding: 6px 14px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }
    .user-pill { font-size: 12px; background: #e8f5e9; color: #2e7d32; padding: 5px 10px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    #statusNotice { font-size: 12px; color: #444; background: #fff9c4; padding: 8px 12px; text-align: center; border-bottom: 1px solid #fff59d; }

    .stat-banner { margin: 16px; padding: 20px; border-radius: 16px; background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%); color: #1e3a8a; }
    .stat-banner .label { font-size: 13px; opacity: 0.8; }
    .stat-banner .main-num { font-size: 32px; font-weight: 700; margin: 6px 0; }
    .stat-banner .sub-row { display: flex; gap: 20px; margin-top: 10px; font-size: 13px; }

    .view-container { display: none; padding: 0 16px; }
    .view-container.active { display: block; }

    .section-card { background: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .section-title { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .item-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .item-row:last-child { border-bottom: none; }
    .item-left { display: flex; align-items: center; gap: 12px; }
    .item-icon { width: 38px; height: 38px; border-radius: 10px; background: #fff3e0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .item-title { font-size: 15px; font-weight: 500; }
    .item-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .item-badge { background: #ffebee; color: #c62828; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #fff; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 50; }
    .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #888; flex: 1; height: 100%; justify-content: center; cursor: pointer; }
    .nav-btn.active { color: var(--primary); font-weight: 600; }
    .nav-btn .icon { font-size: 20px; margin-bottom: 2px; }
    .fab-btn { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #ff8a65, #f4511e); color: #fff; border: none; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(244,81,30,0.35); transform: translateY(-12px); cursor: pointer; }

    /* 彈窗樣式：關閉時完全 display:none，絕不遮擋任何觸控 */
    .modal-overlay { 
      position: fixed; 
      top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.5); 
      z-index: 999; 
      display: none; 
      align-items: flex-end; 
    }
    .modal-sheet { background: #fff; width: 100%; border-radius: 20px 20px 0 0; padding: 20px 18px; max-height: 85vh; overflow-y: auto; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; background: #fafafa; }
    .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 10px; background: var(--primary); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  </style>

  <!-- 引入 Firebase 庫 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div id="statusNotice">系統載入中...</div>

  <div class="top-header">
    <h2 id="headerTitle">正在用的帳本</h2>
    <div id="authContainer">
      <button class="auth-btn-top" id="topAuthBtn" type="button">登入 / 註冊</button>
    </div>
  </div>

  <!-- 1. 首頁：流水 -->
  <div id="viewHome" class="view-container active">
    <div class="stat-banner">
      <div class="label">本月淨資產變動</div>
      <div class="main-num" id="totalNetBalance">$0.00</div>
      <div class="sub-row">
        <span>總收入：<b id="monthlyIncome">$0</b></span>
        <span>總支出：<b id="monthlyExpense">$0</b></span>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title">最新流水明細</div>
      <div id="transactionList" style="color:#888; font-size:14px; text-align:center; padding:15px 0;">尚無紀錄，點下方 ＋ 即可記帳</div>
    </div>
  </div>

  <!-- 2. 帳戶：主子帳戶結構 -->
  <div id="viewAccounts" class="view-container">
    <div class="stat-banner" style="background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%); color: #14532d;">
      <div class="label">帳戶總資產</div>
      <div class="main-num" id="accountTotalSum">$0.00</div>
      <div style="font-size:12px; opacity:0.85;">包含現金及各銀行子帳戶合計</div>
    </div>

    <div class="section-card">
      <div class="section-title">
        <span>現金帳戶</span>
        <span id="cashGroupTotal">$0.00</span>
      </div>
      <div id="cashAccountList"></div>
    </div>

    <div class="section-card">
      <div class="section-title">
        <span>儲蓄帳戶</span>
        <span id="bankGroupTotal">$0.00</span>
      </div>
      <div id="bankAccountList"></div>
    </div>
  </div>

  <!-- 底部導覽列 -->
  <div class="bottom-nav">
    <button class="nav-btn active" id="tabHomeBtn" type="button">
      <span class="icon">📑</span>
      <span>流水</span>
    </button>
    <button class="fab-btn" id="fabAddBtn" type="button">＋</button>
    <button class="nav-btn" id="tabAccBtn" type="button">
      <span class="icon">💳</span>
      <span>帳戶</span>
    </button>
  </div>

  <!-- 登入 / 註冊彈窗 -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 id="authModalTitle">雲端帳號登入</h3>
        <button type="button" id="closeAuthBtn" style="border:none; background:none; font-size:22px; padding:4px 8px;">✕</button>
      </div>
      <div class="form-group">
        <label>電子郵件 (帳號)</label>
        <input type="email" id="authEmail" class="form-control" placeholder="example@mail.com" inputmode="email">
      </div>
      <div class="form-group">
        <label>密碼 (至少 6 位數)</label>
        <input type="password" id="authPassword" class="form-control" placeholder="請輸入密碼">
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn-submit" id="doLoginBtn" type="button">登入</button>
        <button class="btn-submit" id="doRegisterBtn" style="background:#4b5563;" type="button">註冊新帳號</button>
      </div>
      <p style="font-size:12px; color:#888; margin-top:12px; text-align:center;">註冊後，其他手機輸入相同帳號密碼即可共同記帳同步！</p>
    </div>
  </div>

  <!-- 記帳彈窗 -->
  <div class="modal-overlay" id="recordModal">
    <div class="modal-sheet">
      <h3 style="margin-bottom:15px;">記一筆帳</h3>
      <div class="form-group">
        <label>收支類型</label>
        <select id="recType" class="form-control">
          <option value="expense">支出 (-)</option>
          <option value="income">收入 (+)</option>
        </select>
      </div>
      <div class="form-group">
        <label>金額</label>
        <input type="number" id="recAmount" class="form-control" placeholder="0.00" inputmode="decimal">
      </div>
      <div class="form-group">
  <label>主帳戶</label>
  <select id="recMainAccount" class="form-control" onchange="onMainAccountChange()"></select>
</div>
<div class="form-group">
  <label>主帳戶</label>
  <select id="recMainAccount" class="form-control" onchange="onMainAccountChange()"></select>
</div>
<div class="form-group">
  <label>子帳戶 / 信封</label>
  <select id="recSubAccount" class="form-control"></select>
</div>
      <div class="form-group">
        <label>備註說明</label>
        <input type="text" id="recNote" class="form-control" placeholder="例如：加油、健保費扣款">
      </div>
      <button class="btn-submit" id="saveRecordBtn" type="button">儲存紀錄</button>
      <button class="form-control" id="cancelRecordBtn" style="margin-top:8px; border:none;" type="button">取消</button>
    </div>
  </div>

  <!-- 子帳戶抽屜 -->
  <div class="modal-overlay" id="subAccountModal">
    <div class="modal-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 id="subModalTitle">子帳戶列表</h3>
        <button type="button" id="closeSubModalBtn" style="border:none; background:none; font-size:22px; padding:4px 8px;">✕</button>
      </div>
      <div id="subAccountList" style="margin-bottom:15px;"></div>
      <div style="background:#f9f9f9; padding:12px; border-radius:10px;">
        <h4 style="font-size:13px; margin-bottom:8px;">＋ 新增子分類/專款用途</h4>
        <div style="display:flex; gap:8px;">
          <input type="text" id="newSubName" class="form-control" placeholder="子帳戶名稱">
          <button class="btn-submit" id="addSubBtn" style="width:90px; margin:0;" type="button">新增</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 就地立即綁定腳本：不依賴 window.onload，直通 DOM -->
  <script>
    var DEFAULT_ACCOUNTS = [
      { id: 'cash', group: 'cash', name: '所有現金支出', balance: 0, subAccounts: ['現金日常', '未分類消費'] },
      { id: 'post', group: 'bank', name: '郵局', balance: 0, subAccounts: ['郵局。晨晨', '郵局。屬於外送', '郵局。賺的收入', '郵局。阿暐', '郵局。健保費1652元', '郵局。暐~年金2658元', '郵局。君~年金2658元', '郵局。存款', '郵局。總'] },
      { id: 'cathay', group: 'bank', name: '國泰', balance: 0, subAccounts: ['一般存款'] },
      { id: 'taishin', group: 'bank', name: '台新', balance: 0, subAccounts: ['一般存款'] },
      { id: 'jko_taishin', group: 'bank', name: '街利存 - 台新', balance: 0, subAccounts: ['日常消費存'] },
      { id: 'ubot', group: 'bank', name: '聯邦銀行', balance: 0, subAccounts: ['一般存款'] }
    ];

    var userAccounts = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
    var currentUser = null;
    var currentViewingGroup = null;
    var auth = null;
    var db = null;

    function updateNotice(txt) {
      var el = document.getElementById('statusNotice');
      if (el) el.innerText = txt;
    }

    function openModal(id) {
      var el = document.getElementById(id);
      if (el) el.style.display = 'flex';
    }

    function closeModal(id) {
      var el = document.getElementById(id);
      if (el) el.style.display = 'none';
    }

    function switchNav(tab) {
      var homeV = document.getElementById('viewHome');
      var accV = document.getElementById('viewAccounts');
      var homeB = document.getElementById('tabHomeBtn');
      var accB = document.getElementById('tabAccBtn');
      var title = document.getElementById('headerTitle');

      if (tab === 'home') {
        homeV.classList.add('active');
        accV.classList.remove('active');
        homeB.classList.add('active');
        accB.classList.remove('active');
        title.innerText = "正在用的帳本";
      } else {
        accV.classList.add('active');
        homeV.classList.remove('active');
        accB.classList.add('active');
        homeB.classList.remove('active');
        title.innerText = "帳戶資產與分項";
        renderAccountView();
      }
    }

    function renderAccountView() {
      var cashList = document.getElementById('cashAccountList');
      var bankList = document.getElementById('bankAccountList');
      if (!cashList || !bankList) return;
      cashList.innerHTML = '';
      bankList.innerHTML = '';

      var totalSum = 0, cashSum = 0, bankSum = 0;

      for (var i = 0; i < userAccounts.length; i++) {
        (function(acc) {
          var row = document.createElement('div');
          row.className = 'item-row';
          row.innerHTML = 
            '<div class="item-left">' +
              '<div class="item-icon">' + (acc.group === 'cash' ? '💵' : '🏦') + '</div>' +
              '<div>' +
                '<div class="item-title">' + acc.name + ' <span class="item-badge">' + (acc.subAccounts ? acc.subAccounts.length : 0) + '組</span></div>' +
                '<div class="item-sub">' + (acc.subAccounts ? acc.subAccounts.slice(0, 3).join('、') + '...' : '') + '</div>' +
              '</div>' +
            '</div>' +
            '<div style="font-weight:600; font-size:15px;">$' + (acc.balance || 0).toLocaleString() + ' ❯</div>';
          
          row.onclick = function() { openSubAccountModal(acc); };

          if (acc.group === 'cash') {
            cashList.appendChild(row);
            cashSum += (acc.balance || 0);
          } else {
            bankList.appendChild(row);
            bankSum += (acc.balance || 0);
          }
          totalSum += (acc.balance || 0);
        })(userAccounts[i]);
      }

      document.getElementById('accountTotalSum').innerText = '$' + totalSum.toLocaleString();
      document.getElementById('cashGroupTotal').innerText = '$' + cashSum.toLocaleString();
      document.getElementById('bankGroupTotal').innerText = '$' + bankSum.toLocaleString();
    }

    function openSubAccountModal(acc) {
      currentViewingGroup = acc;
      document.getElementById('subModalTitle').innerText = acc.name + " 的子帳戶";
      var container = document.getElementById('subAccountList');
      container.innerHTML = '';

      var subs = acc.subAccounts || [];
      for (var i = 0; i < subs.length; i++) {
        var item = document.createElement('div');
        item.className = 'item-row';
        // 此處已徹底去除「專用信封」文字
        item.innerHTML = 
          '<div class="item-left"><span style="font-size:16px;">📁</span><span class="item-title">' + subs[i] + '</span></div>';
        container.appendChild(item);
      }

      openModal('subAccountModal');
    }

    function populateAccountSelect() {
      var select = document.getElementById('recAccount');
      if (!select) return;
      select.innerHTML = '';
      for (var i = 0; i < userAccounts.length; i++) {
        var acc = userAccounts[i];
        var subs = acc.subAccounts || [];
        for (var j = 0; j < subs.length; j++) {
          var opt = document.createElement('option');
          opt.value = acc.id + ':::' + subs[j];
          opt.innerText = acc.name + ' - ' + subs[j];
          select.appendChild(opt);
        }
      }
    }

    // 立即綁定所有原生點擊，不等待任何網路事件
    document.getElementById('tabHomeBtn').onclick = function() { switchNav('home'); };
    document.getElementById('tabAccBtn').onclick = function() { switchNav('accounts'); };
    document.getElementById('fabAddBtn').onclick = function() {
      populateAccountSelect();
      openModal('recordModal');
    };
    document.getElementById('cancelRecordBtn').onclick = function() { closeModal('recordModal'); };
    document.getElementById('closeSubModalBtn').onclick = function() { closeModal('subAccountModal'); };

    document.getElementById('topAuthBtn').onclick = function() { openModal('authModal'); };
    document.getElementById('closeAuthBtn').onclick = function() { closeModal('authModal'); };

    document.getElementById('doLoginBtn').onclick = handleAuthLogin;
    document.getElementById('doRegisterBtn').onclick = handleAuthRegister;
    document.getElementById('addSubBtn').onclick = handleAddSub;
    document.getElementById('saveRecordBtn').onclick = handleSaveRecord;

    renderAccountView();
    populateAccountSelect();
    updateNotice("介面就緒，正在連接雲端服務...");

    // 初始化 Firebase
    try {
      var firebaseConfig = {
        apiKey: "AIzaSyCZ6Vt2WmGHsQX-WHaQAr-KId2-ra2zXfo",
        authDomain: "my-ledger-2026-25b34.firebaseapp.com",
        projectId: "my-ledger-2026-25b34",
        storageBucket: "my-ledger-2026-25b34.firebasestorage.app",
        messagingSenderId: "306333474464",
        appId: "1:306333474464:web:afd783bf4d255f981c33c5"
      };

      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();

      auth.onAuthStateChanged(function(user) {
        currentUser = user;
        var container = document.getElementById('authContainer');
        if (user) {
          container.innerHTML = '<span class="user-pill" id="logoutBtn">' + user.email.split('@')[0] + ' (登出)</span>';
          document.getElementById('logoutBtn').onclick = function() {
            if (confirm("確定要登出嗎？")) auth.signOut();
          };
          updateNotice("已連線同步帳號：" + user.email);
          syncCloudData();
        } else {
          container.innerHTML = '<button class="auth-btn-top" id="topAuthBtn" type="button">登入 / 註冊</button>';
          document.getElementById('topAuthBtn').onclick = function() { openModal('authModal'); };
          updateNotice("尚未登入，請點右上角「登入 / 註冊」");
        }
      });
    } catch(e) {
      updateNotice("離線運行中 (可手動操作)");
    }

    function handleAuthRegister() {
      if (!auth) return alert("Firebase 模組尚未準備完成");
      var email = document.getElementById('authEmail').value.trim();
      var pwd = document.getElementById('authPassword').value;
      if (!email || !pwd || pwd.length < 6) return alert("請輸入正確 Email，且密碼至少 6 位數");

      auth.createUserWithEmailAndPassword(email, pwd)
        .then(function() {
          alert("註冊成功！");
          closeModal('authModal');
        })
        .catch(function(err) {
          alert("註冊失敗: " + err.message);
        });
    }

    function handleAuthLogin() {
      if (!auth) return alert("Firebase 模組尚未準備完成");
      var email = document.getElementById('authEmail').value.trim();
      var pwd = document.getElementById('authPassword').value;
      if (!email || !pwd) return alert("請輸入帳號與密碼");

      auth.signInWithEmailAndPassword(email, pwd)
        .then(function() {
          closeModal('authModal');
        })
        .catch(function(err) {
          alert("登入失敗: " + err.message);
        });
    }

    function syncCloudData() {
      if (!currentUser || !db) return;
      var accRef = db.collection("users").doc(currentUser.uid).collection("account_settings");

      accRef.get().then(function(snap) {
        if (snap.empty) {
          DEFAULT_ACCOUNTS.forEach(function(acc) {
            accRef.doc(acc.id).set(acc);
          });
        }
      });

      accRef.onSnapshot(function(snapshot) {
        if (!snapshot.empty) {
          userAccounts = [];
          snapshot.forEach(function(d) { userAccounts.push(d.data()); });
          renderAccountView();
          populateAccountSelect();
        }
      });

      db.collection("users").doc(currentUser.uid).collection("records")
        .orderBy("timestamp", "desc")
        .limit(30)
        .onSnapshot(function(snapshot) {
          var listDiv = document.getElementById("transactionList");
          if (snapshot.empty) {
            listDiv.innerHTML = "<p style='color:#999; text-align:center; padding:15px 0;'>尚無任何流水紀錄</p>";
            document.getElementById('monthlyExpense').innerText = '$0';
            document.getElementById('monthlyIncome').innerText = '$0';
            document.getElementById('totalNetBalance').innerText = '$0.00';
            return;
          }

          listDiv.innerHTML = "";
          var mExpense = 0, mIncome = 0;

          snapshot.forEach(function(docSnap) {
            var item = docSnap.data();
            if (item.type === 'expense') mExpense += Number(item.amount);
            if (item.type === 'income') mIncome += Number(item.amount);

            var div = document.createElement("div");
            div.className = "item-row";
            var dateStr = new Date(item.timestamp).toLocaleString([], { month: '2-digit', day: '2-digit', hour: '2-digit', minute:'2-digit' });
            div.innerHTML = 
              '<div><div class="item-title">' + (item.note || '日常收支') + '</div><div class="item-sub">' + dateStr + ' · <span style="color:#007bff;">' + (item.subAccountName || '') + '</span></div></div>' +
              '<span style="font-weight:700; font-size:16px; color:' + (item.type === 'income' ? 'var(--income)' : 'var(--text-main)') + '">' +
                (item.type === 'income' ? '+' : '-') + '$' + Number(item.amount).toLocaleString() +
              '</span>';
            listDiv.appendChild(div);
          });

          document.getElementById('monthlyExpense').innerText = '$' + mExpense.toLocaleString();
          document.getElementById('monthlyIncome').innerText = '$' + mIncome.toLocaleString();
          document.getElementById('totalNetBalance').innerText = '$' + (mIncome - mExpense).toLocaleString();
        });
    }

    function handleAddSub() {
      var input = document.getElementById('newSubName');
      var val = input.value.trim();
      if (!val || !currentViewingGroup) return;

      var updated = (currentViewingGroup.subAccounts || []).concat([val]);
      if (currentUser && db) {
        db.collection("users").doc(currentUser.uid).collection("account_settings").doc(currentViewingGroup.id).update({
          subAccounts: updated
        });
      } else {
        currentViewingGroup.subAccounts = updated;
        renderAccountView();
      }
      input.value = '';
      currentViewingGroup.subAccounts = updated;
      openSubAccountModal(currentViewingGroup);
    }

    function handleSaveRecord() {
      var amt = Number(document.getElementById('recAmount').value);
      if (!amt || amt <= 0) return alert("請輸入正確金額");

      var parts = document.getElementById('recAccount').value.split(':::');
      var accId = parts[0];
      var subName = parts[1];
      var recType = document.getElementById('recType').value;
      var note = document.getElementById('recNote').value.trim();

      if (!currentUser || !db) {
        alert("請先完成登入才能同步至雲端");
        return;
      }

      var btn = document.getElementById('saveRecordBtn');
      btn.disabled = true;
      btn.innerText = "儲存中...";

      db.collection("users").doc(currentUser.uid).collection("records").add({
        amount: amt,
        type: recType,
        accountId: accId,
        subAccountName: subName,
        note: note,
        timestamp: Date.now()
      }).then(function() {
        var acc = userAccounts.find(function(a) { return a.id === accId; });
        if (acc) {
          var newBal = (acc.balance || 0) + (recType === 'income' ? amt : -amt);
          db.collection("users").doc(currentUser.uid).collection("account_settings").doc(accId).update({
            balance: newBal
          });
        }
        document.getElementById('recAmount').value = '';
        document.getElementById('recNote').value = '';
        closeModal('recordModal');
      }).catch(function(err) {
        alert("儲存失敗: " + err.message);
      }).finally(function() {
        btn.disabled = false;
        btn.innerText = "儲存紀錄";
      });
    }
  </script>
</body>
</html>
